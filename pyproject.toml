[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "mplvega"
version = "0.1.0"
description = "Matplotlib-shaped Vega-Lite frontend with optional fortplot rendering"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
numpy = ["numpy"]
test = ["pytest", "numpy", "matplotlib"]
docs = ["sphinx>=8", "furo>=2024.8.6", "numpy", "matplotlib"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["mplvega*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
